[package]
name = "ratatoist"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first terminal client for Todoist"
repository = "https://github.com/cxrlos/ratatoist"
homepage = "https://github.com/cxrlos/ratatoist"
license = "MIT OR Apache-2.0"
readme = "README.md"
include = ["/src/**/*.rs", "/src/ui/themes/*.json", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

[[bin]]
name = "ratatoist"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
etcetera = "0.11.0"
futures-util = "0.3.34"
jiff = { version = "0.2.42", features = ["serde"] }
keyring-core = "1.0.1"
nucleo-matcher = "0.3.1"
rand = "0.10"
ratatui = "0.30"
rpassword = "7.5.4"
semver = "1.0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
toml_edit = "0.25.19"
toml_parser = "1.1.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
unicode-width = "0.2.3"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1.0", features = ["crypto-rust", "vendored"] }
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }
linux-keyutils-keyring-store = "1.0.0"

[dev-dependencies]
insta = "1.49.0"
portable-pty = "0.9.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rustix = { version = "1.1.6", features = ["process", "termios"] }
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6.5"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[profile.dist]
inherits = "release"
lto = "thin"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
