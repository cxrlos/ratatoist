[package]
name = "ratatoist"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first terminal client for Todoist"
repository = "https://github.com/cxrlos/ratatoist"
license = "MIT"
readme = "README.md"
include = ["/src/**/*.rs", "/themes/*.json", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

[[bin]]
name = "ratatoist"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
futures-util = "0.3"
rand = "0.8"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
