name: Feature request
description: Suggest something ratatoist should do
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: todoist-concepts
    attributes:
      label: Todoist concepts involved
      description: Tasks, projects, sections, labels, filters, due dates... Use the terms in GLOSSARY.md where they apply.
